<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Tag</title>
  </head>
  <body>
    <form action="">
      Name: <input type="text" name="" id="" placeholder="Enter Name" />
      <br /><br />
      Surname: <input type="text" name="" id="" /> <br /><br />
      Number:
      <input
        type="number"
        name=""
        id=""
        minlength="10"
        maxlength="10"
        placeholder="Enter Mobile No."
      />
      <br /><br />
      Email: <input type="email" name="" id="" value="@gmail.com" />
      <br /><br />
      Password:
      <input
        type="password"
        name=""
        id=""
        required
        placeholder="Enter 6 Digit Password"
        minlength="6"
        maxlength="6"
      />
      <br /><br />
      Form Submit Date: <input type="date" name="" id="" /> <br /><br />
      Form Submit Time: <input type="time" name="" id="" /> <br /><br />
      DateTime: <input type="datetime-local" name="" id="" /> <br /><br />
      Week: <input type="week" name="" id="" /> <br /><br />
      Month: <input type="month" name="" id="" /> <br /><br />
      Gender: <input type="radio" name="g" id="" />Male
      <input type="radio" name="g" id="" />Female <br /><br />
      Hobbies: <input type="checkbox" name="" id="" />Singing
      <input type="checkbox" name="" id="" />Reading
      <input type="checkbox" name="" id="" />Writing <br /><br />
      City:
      <select name="" id="">
        <option value="" selected disabled>Selected City</option>
        <option value="">Surat</option>
        <option value="">Rajkot</option>
        <option value="">Bhavnagar</option>
      </select>

      <br /><br />
      Address:
      <textarea
        name=""
        id=""
        rows="5"
        cols="25"
        placeholder="Enter Your Full Address"
      ></textarea>
      <br /><br />
      Profile Photo:
      <input
        type="file"
        name=""
        id=""
        placeholder="Upload Passport size photo"
      />
      <br /><br />
      color: <input type="color" name="" id="" /> <br /><br />
      <input type="submit" name="" id="" />
      <input type="reset" name="" id="" />
      <br /><br />
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
      <button type="button">Button</button>
    </form>
  </body>
</html>
