<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Tag</title>
  </head>
  <body>
    <img
      src="mediatag/whatsapp.png"
      alt="WhatsApp"
      hight="150px"
      width="150px"
      title="This is WhatsApp"
    />

    <br />

    <!-- online Image Show -->

    <a href="https://www.whatsapp.com/" target="_blank">WhatsApp</a>

    <a href="https://www.whatsapp.com/" target="_blank">
      <img
        src="mediatag/whatsapp.png"
        alt="WhatsApp"
        hight="150px"
        width="150px"
        title="This is WhatsApp"
      />
    </a>
    <br /><br />
    <h3>You Tube Video</h3>
    <hr width="50%" align="left" />

    <!-- youtube vedio Play -->

    <iframe
      src="https://www.youtube.com/embed/vJQCAtzSfuo?si=aZz_atkLgBr1S5Y_"
      frameborder="0"
      height="500px"
      width="50%"
      title="This is Youtube Media Player"
    ></iframe>
    <iframe
      src="https://youtu.be/T94PHkuydcw?si=raCxdP5LqK6KlMv-"
      frameborder="0"
    ></iframe>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/QdB6A5QzdfY?si=yB8hu1wk4bQabjOa"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/9T-Zbxg9X_4?si=SUBUbGrSICQ6VU9k"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- Web site Show -->

    <br /><br />
    <h3>Open Website</h3>
    <hr width="50%" align="left" />

    <iframe
      src="https://krushnam-jewels.com/"
      frameborder="5"
      width="50%"
      height="500px"
    ></iframe>

    <br /><br />

    <!-- Audio Player -->

    <h3>Audio Player</h3>
    <hr width="50%" align="left" />

    <audio controls autoplay width="50%" hight="100px">
      <source src="mediatag/audio.mp3" type="audio/mp3" />
    </audio>
    <br /><br />

    <!-- Video Player -->

    <h3>Video Player</h3>
    <hr width="50%" align="left" />
    <video controls autoplay width="50%" height="500px">
      <source src="mediatag/video.mp4" type="video/mp4" />
    </video>
  </body>
</html>
